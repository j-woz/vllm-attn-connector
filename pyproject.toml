[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-kvnorm"
version = "0.1.0"
description = "Out-of-tree vLLM KV connector that captures per-token KV importance scores as Flowcept provenance (PagedEviction proxy)."
requires-python = ">=3.10"
dependencies = []  # vllm and flowcept are provided by the host environment

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
